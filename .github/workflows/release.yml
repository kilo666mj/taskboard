name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a dry-run build
        required: false
        default: dev

permissions: {}

jobs:
  binaries:
    name: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tag belongs to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Test
        run: go test -race ./...
      - name: Build release bundles
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
        run: |
          ./scripts/build-release.sh "$VERSION"
          chart_version="${VERSION#v}"
          if [[ ! "$chart_version" =~ ^[0-9] ]]; then
            chart_version="0.0.0-${chart_version}"
          fi
          helm package charts/taskboard --version "$chart_version" --app-version "$VERSION" --destination dist
          (cd dist && sha256sum "taskboard-${chart_version}.tgz" >> SHA256SUMS)
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/taskboard-*.tgz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/taskboard-*.tgz
            dist/SHA256SUMS
