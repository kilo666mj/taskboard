<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up Taskboard</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main>
    <div class="mark"><i></i><i></i><i></i></div>
    <p class="eyebrow">Desktop setup</p>
    <h1>Connect Taskboard</h1>
    <p class="copy">Enter the origin of your Taskboard service. This app will keep its live status stream running in the Plasma system tray.</p>
    <form id="setup"><label>Taskboard origin<input id="origin" type="url" required placeholder="https://taskboard.example.com" autocomplete="url"></label><p id="error" role="alert"></p><button type="submit">Connect</button></form>
  </main>
  <script src="app.js"></script>
</body>
</html>
