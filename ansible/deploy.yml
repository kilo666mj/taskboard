---
- name: Deploy Taskboard
  hosts: taskboard
  become: true
  vars_files:
    - private.yml
  vars:
    taskboard_source_dir: "{{ playbook_dir }}/.."
    taskboard_build_dir: "{{ playbook_dir }}/.build"
    taskboard_binary: "{{ taskboard_build_dir }}/taskboard"
    taskboard_database_url: ""
    taskboard_lease_seconds: 900
    # Deprecated; leave empty and use taskboard_task_type instead.
    taskboard_mcp_default_type: ""
    taskboard_task_type: ""
    taskboard_default_requirements: []
    taskboard_browser_auth_mode: oidc
    taskboard_cf_access_team_domain: ""
    taskboard_cf_access_aud: ""
    taskboard_cf_access_allowed_subjects: []
    taskboard_cf_access_allowed_emails: []
    taskboard_cf_access_allowed_groups: []
    taskboard_cf_access_trust_policy: false
    taskboard_oidc_trust_provider_policy: false
    taskboard_default_role: member
    taskboard_owner_groups: []
    taskboard_admin_groups: []
    taskboard_member_groups: []
    taskboard_viewer_groups: []
    taskboard_agent_capabilities:
      - task:read
      - task:create
      - task:claim
      - task:update
      - task:message
      - task:escalate
      - task:control
      - task:reference
      - task:handoff
      - task:evidence
      - task:session
      - task:usage
      - worker:advertise
      - task:complete
      - task:skip
      - template:read
      - template:manage
    taskboard_agent_max_concurrent_runs: 8
    taskboard_agent_max_pickups_per_minute: 30
    taskboard_agent_max_run_seconds: 28800
    taskboard_agent_require_idempotency: false
    taskboard_mcp_human_delegation: false
    taskboard_mcp_delegation_principals: []
    taskboard_answer_delegation_principals: []
    taskboard_agent_policies_json: ""
    taskboard_retention_days: 0
    taskboard_webhook_url: ""
    taskboard_webhook_max_attempts: 8
    # Build from a checkout with uncommitted changes. Leave false for
    # production, so the deployed binary always matches a commit.
    taskboard_allow_dirty_build: false
    # Back up the SQLite database before installing. Backups are written next
    # to it as taskboard.db.pre-<revision>-<UTC time>; the newest
    # taskboard_backup_keep are kept, and 0 keeps them all.
    taskboard_backup_enabled: true
    taskboard_backup_keep: 10

  pre_tasks:
    - name: Validate deployment inputs
      ansible.builtin.assert:
        that:
          - taskboard_auth_token | length >= 32
          - taskboard_vapid_public_key | length > 32
          - taskboard_vapid_private_key | length > 32
          - taskboard_vapid_contact | length > 0
          - taskboard_allowed_hosts | length > 0
          - taskboard_browser_auth_mode in ['oidc', 'cloudflare_access']
          - taskboard_browser_auth_mode != 'oidc' or taskboard_oidc_issuer | length > 0
          - taskboard_browser_auth_mode != 'oidc' or taskboard_oidc_client_id | length > 0
          - taskboard_browser_auth_mode != 'oidc' or taskboard_oidc_redirect_url | length > 0
          - taskboard_browser_auth_mode != 'cloudflare_access' or taskboard_cf_access_team_domain | length > 0
          - taskboard_browser_auth_mode != 'cloudflare_access' or taskboard_cf_access_aud | length > 0
          - taskboard_browser_auth_mode != 'oidc' or taskboard_oidc_trust_provider_policy | bool or (taskboard_oidc_allowed_subjects | length + taskboard_oidc_allowed_emails | length + taskboard_oidc_allowed_groups | length) > 0
          - taskboard_browser_auth_mode != 'cloudflare_access' or taskboard_cf_access_trust_policy | bool or (taskboard_cf_access_allowed_subjects | length + taskboard_cf_access_allowed_emails | length + taskboard_cf_access_allowed_groups | length) > 0
          - taskboard_mcp_default_type in ['', 'personal', 'work']
          - taskboard_task_type in ['', 'personal', 'work']
          - taskboard_default_role in ['owner', 'admin', 'member', 'viewer']
          - taskboard_agent_max_concurrent_runs | int >= 1
          - taskboard_agent_max_pickups_per_minute | int >= 1
          - taskboard_agent_max_run_seconds | int >= 60
          - taskboard_retention_days | int >= 0
          - taskboard_webhook_max_attempts | int >= 1
          - taskboard_backup_keep | int >= 0
          - taskboard_webhook_url | length == 0 or taskboard_webhook_secret | length >= 32
          - "'replace' not in (taskboard_auth_token | lower)"
        fail_msg: Run go run ./cmd/taskboard-init-config before deploying.
      no_log: true

    - name: Read source revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ taskboard_source_dir }}"
      register: taskboard_source_revision
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    # Release builds stamp the tag; a later commit gets tag-count-gsha.
    - name: Read source version
      ansible.builtin.command:
        argv: [git, describe, --tags, --always, --match, "v*"]
        chdir: "{{ taskboard_source_dir }}"
      register: taskboard_source_version
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    # Go marks a build as modified when git status reports any change,
    # including untracked files, so check the same way.
    - name: Read source status
      ansible.builtin.command:
        argv: [git, status, --porcelain]
        chdir: "{{ taskboard_source_dir }}"
      register: taskboard_source_status
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    - name: Require a clean checkout
      ansible.builtin.assert:
        that: taskboard_allow_dirty_build | bool or taskboard_source_status.stdout | length == 0
        fail_msg: >-
          The checkout has uncommitted or untracked changes, so the binary would
          not match a commit. Commit or stash them, or set
          taskboard_allow_dirty_build=true for a test deployment.
      delegate_to: localhost
      become: false
      run_once: true

    - name: Record build identity
      ansible.builtin.set_fact:
        taskboard_build_revision: "{{ taskboard_source_revision.stdout }}"
        taskboard_build_version: "{{ taskboard_source_version.stdout }}"
        taskboard_build_modified: "{{ taskboard_source_status.stdout | length > 0 }}"

    - name: Create local build directory
      ansible.builtin.file:
        path: "{{ taskboard_build_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Build Taskboard on the controller
      ansible.builtin.command:
        argv:
          - go
          - build
          - -trimpath
          - -ldflags=-s -w -X github.com/kilo666mj/taskboard/internal/server.Version={{ taskboard_build_version }}
          - -o
          - "{{ taskboard_binary }}"
          - ./cmd/taskboard
        chdir: "{{ taskboard_source_dir }}"
      environment:
        GOCACHE: /tmp/taskboard-ansible-go-cache
        # Build for the target, not the controller. The SQLite driver is
        # pure Go, so a static cross-build works from any controller.
        CGO_ENABLED: "0"
        GOOS: linux
        GOARCH: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

  tasks:
    - name: Create service account
      ansible.builtin.user:
        name: taskboard
        system: true
        home: /var/lib/taskboard
        shell: /usr/sbin/nologin

    - name: Create configuration directory
      ansible.builtin.file:
        path: /etc/taskboard
        state: directory
        owner: root
        group: taskboard
        mode: "0750"

    - name: Create state directory
      ansible.builtin.file:
        path: /var/lib/taskboard
        state: directory
        owner: taskboard
        group: taskboard
        mode: "0750"

    # Stage the binary and environment next to the live ones and validate
    # them together, so a configuration the new build rejects fails the
    # deployment instead of crash-looping the restarted service.
    - name: Stage Taskboard binary
      ansible.builtin.copy:
        src: "{{ taskboard_binary }}"
        dest: /usr/local/bin/taskboard.candidate
        owner: root
        group: root
        mode: "0755"

    - name: Stage protected environment
      ansible.builtin.template:
        src: templates/taskboard.env.j2
        dest: /etc/taskboard/taskboard.env.candidate
        owner: root
        group: taskboard
        mode: "0640"

    - name: Validate staged configuration
      ansible.builtin.command:
        argv:
          - /usr/local/bin/taskboard.candidate
          - -check-config
          - -env-file
          - /etc/taskboard/taskboard.env.candidate
      changed_when: false

    - name: Check for an existing SQLite database
      ansible.builtin.stat:
        path: /var/lib/taskboard/taskboard.db
      register: taskboard_database_file
      when: taskboard_backup_enabled | bool and taskboard_database_url | length == 0

    # An online backup is consistent while Taskboard keeps running, and the
    # integrity check fails the deployment before anything is replaced.
    - name: Back up SQLite database
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts['python']['executable'] }}"
          - -c
          - |
            import os, sqlite3, sys
            source, target = sys.argv[1], sys.argv[2]
            os.umask(0o077)
            reader = sqlite3.connect(f"file:{source}?mode=ro", uri=True)
            writer = sqlite3.connect(target)
            reader.backup(writer)
            reader.close()
            result = writer.execute("PRAGMA integrity_check").fetchone()[0]
            writer.close()
            if result != "ok":
                sys.exit(f"backup integrity check failed: {result}")
            print(target)
          - /var/lib/taskboard/taskboard.db
          - "/var/lib/taskboard/taskboard.db.pre-{{ taskboard_build_revision[:7] }}-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"
      register: taskboard_backup
      changed_when: true
      when: taskboard_database_file.stat is defined and taskboard_database_file.stat.exists

    - name: Find database backups
      ansible.builtin.find:
        paths: /var/lib/taskboard
        patterns: taskboard.db.pre-*
      register: taskboard_backups
      when: taskboard_backup is changed and taskboard_backup_keep | int > 0

    - name: Remove old database backups
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ (taskboard_backups.files | sort(attribute='mtime', reverse=true))[taskboard_backup_keep | int:] }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: taskboard_backups.files is defined

    - name: Install Taskboard binary
      ansible.builtin.copy:
        src: /usr/local/bin/taskboard.candidate
        remote_src: true
        dest: /usr/local/bin/taskboard
        owner: root
        group: root
        mode: "0755"
      notify: Restart Taskboard

    - name: Install protected environment
      ansible.builtin.copy:
        src: /etc/taskboard/taskboard.env.candidate
        remote_src: true
        dest: /etc/taskboard/taskboard.env
        owner: root
        group: taskboard
        mode: "0640"
      notify: Restart Taskboard

    - name: Install systemd unit
      ansible.builtin.template:
        src: templates/taskboard.service.j2
        dest: /etc/systemd/system/taskboard.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart Taskboard

    - name: Enable Taskboard
      ansible.builtin.systemd_service:
        name: taskboard
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply pending restarts
      ansible.builtin.meta: flush_handlers

    - name: Verify local readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:8095/readyz
        status_code: 200
      register: readiness
      retries: 10
      delay: 1
      until: readiness.status == 200

    - name: Read installed version
      ansible.builtin.command:
        argv: [/usr/local/bin/taskboard, -version]
      register: taskboard_installed_version
      changed_when: false

    - name: Read running executable
      ansible.builtin.shell: readlink "/proc/$(systemctl show -p MainPID --value taskboard)/exe"
      register: taskboard_running_executable
      changed_when: false

    # A running executable shown as deleted is an older binary that the
    # restart did not replace.
    - name: Verify the deployed build is running
      ansible.builtin.assert:
        that:
          - taskboard_installed_version.stdout.startswith(taskboard_expected_version)
          - taskboard_running_executable.stdout == '/usr/local/bin/taskboard'
        fail_msg: >-
          Expected {{ taskboard_expected_version }} running from
          /usr/local/bin/taskboard, found "{{ taskboard_installed_version.stdout }}"
          running from "{{ taskboard_running_executable.stdout }}".
        success_msg: "{{ taskboard_installed_version.stdout }}"
      vars:
        taskboard_expected_version: >-
          taskboard {{ taskboard_build_version }} ({{ taskboard_build_revision
          }}{{ ', modified' if taskboard_build_modified | bool else '' }})

  handlers:
    - name: Restart Taskboard
      ansible.builtin.systemd_service:
        name: taskboard
        state: restarted
        daemon_reload: true
