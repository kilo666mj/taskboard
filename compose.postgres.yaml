services:
  taskboard:
    environment:
      TASKBOARD_DATABASE_URL: postgresql://taskboard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/taskboard?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: taskboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - taskboard-postgres:/var/lib/postgresql
volumes:
  taskboard-postgres:
