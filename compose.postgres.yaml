services:
  taskboard:
    environment:
      TASKBOARD_DATABASE_URL: postgresql://taskboard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/taskboard?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: taskboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - taskboard-postgres:/var/lib/postgresql/data
volumes:
  taskboard-postgres:
