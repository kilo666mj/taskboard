services:
  taskboard:
    environment:
      TASKBOARD_DATABASE_URL: postgresql://taskboard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/taskboard?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: taskboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - taskboard-postgres:/var/lib/postgresql
volumes:
  taskboard-postgres:
