services:
  taskboard:
    environment:
      TASKBOARD_DATABASE_URL: postgresql://taskboard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/taskboard?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: taskboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - taskboard-postgres:/var/lib/postgresql
volumes:
  taskboard-postgres:
