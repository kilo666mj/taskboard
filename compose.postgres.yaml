services:
  taskboard:
    environment:
      TASKBOARD_DATABASE_URL: postgresql://taskboard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/taskboard?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:19@sha256:908d19593a1444b2d4e85783f718b16e0d40f1baf7518420475df9e5f5ac67a2
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: taskboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - taskboard-postgres:/var/lib/postgresql
volumes:
  taskboard-postgres:
    name: ${TASKBOARD_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME}_taskboard-postgres}
